on:
  workflow_call:
    inputs:
      SSH_SCRIPT:
        type: string
        required: true
    secrets:
      TS_AUDIENCE:
        required: true
      TS_OAUTH_CLIENT_ID:
        required: true
      SERVER_HOSTNAME:
        required: true
      SERVER_USER:
        required: true

jobs:
  connect_and_execute:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v4
    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        audience: ${{ secrets.TS_AUDIENCE }}
        tags: tag:ci
        ping: ${{ secrets.SERVER_HOSTNAME }}
    - name: Execute SSH
      run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOSTNAME }} 'bash -s' < ${{ inputs.SSH_SCRIPT }}
permissions:
  id-token: write
